<script>
/* ==================================================================
   Scripts.html
   Client-side logic. Every number on screen comes from
   google.script.run calls into Backend.gs / Code.gs — nothing here
   is hardcoded sample data.
   ================================================================== */

Chart.defaults.font.family = "Tajawal, sans-serif";
Chart.defaults.font.size = 11;
Chart.defaults.color = "#697A91";
const palette = ["#2E86DE","#1FA971","#E1962E","#E5484D","#8B5CF6","#1D4E89","#5AC8FA","#F76E11"];

let chartInstances = {};
let filterOptionsCache = null;
let lastOpenCases = [];
let lastReportsBundle = null;

/* ---------------------------------------------------------------- */
/* Filter state                                                      */
/* ---------------------------------------------------------------- */
function getCurrentFilters() {
  return {
    dateFrom: val('filterDateFrom') || null,
    dateTo: val('filterDateTo') || null,
    branch: val('filterBranch') || null,
    employee: val('filterEmployee') || null,
    account: val('filterAccount') || null,
    driver: val('filterDriver') || null,
    problemType: val('filterProblemType') || null,
    statusBucket: val('filterStatus') || null
  };
}
function val(id) { const el = document.getElementById(id); return el ? el.value : ''; }

/* ---------------------------------------------------------------- */
/* Initial load                                                      */
/* ---------------------------------------------------------------- */
function loadAll() {
  document.getElementById('systemStatus').textContent = 'جاري التحميل...';
  google.script.run
    .withSuccessHandler(onFullAppData)
    .withFailureHandler(onLoadError)
    .getFullAppData(getCurrentFilters());
}

function onLoadError(err) {
  document.getElementById('systemStatus').textContent = 'خطأ فى الاتصال';
  console.error(err);
  alert('حدث خطأ أثناء تحميل البيانات: ' + (err && err.message ? err.message : err));
}

function onFullAppData(data) {
  document.getElementById('systemStatus').textContent = 'البيانات محدثة';
  document.getElementById('tsDashboard').textContent = new Date().toLocaleString('ar-EG');
  document.getElementById('tsInvalidDates').textContent = data.kpis.invalidDateRowCount;

  filterOptionsCache = data.filterOptions;
  populateFilterDropdowns(filterOptionsCache);
  populateMonthSelects(filterOptionsCache.availableMonths);

  renderKPIs(data.kpis);
  renderHero(data.kpis);
  renderDashboardCharts(data);
  renderBranchTable(data.byBranch);
  renderEmployeeTable(data.byEmployee);
  renderEmployeeStats(data.byEmployee, data.kpis);
  renderOpenCases(data.openCases);
}

/* ---------------------------------------------------------------- */
/* Filter dropdowns                                                  */
/* ---------------------------------------------------------------- */
function populateFilterDropdowns(opts) {
  populateSelect('filterBranch', opts.branches, 'كل الفروع');
  populateSelect('filterEmployee', opts.employees, 'الكل');
  populateSelect('filterAccount', opts.accounts, 'كل الـ Accounts');
  populateSelect('filterProblemType', opts.problemTypes, 'الكل');
  populateSelect('filterDriver', opts.drivers, 'الكل');

  // Rule #3: hide the Driver filter entirely when there are no drivers.
  document.getElementById('driverFilterGroup').classList.toggle('hidden', !opts.hasDrivers);
}

function populateSelect(id, values, allLabel) {
  const el = document.getElementById(id);
  const current = el.value;
  el.innerHTML = '<option value="">' + allLabel + '</option>' +
    values.map(v => '<option value="' + escapeAttr(v) + '">' + escapeHtml(v) + '</option>').join('');
  if (values.indexOf(current) !== -1) el.value = current;
}

function populateMonthSelects(months) {
  ['branchM1','branchM2','employeeM1','employeeM2'].forEach((id, idx) => {
    const el = document.getElementById(id);
    if (!el) return;
    const current = el.value;
    el.innerHTML = months.map(m => '<option value="' + m + '">' + m + '</option>').join('');
    if (months.indexOf(current) !== -1) {
      el.value = current;
    } else if (months.length) {
      // default: first select = second-to-last month, second select = last month
      const isSecond = id.endsWith('M2');
      el.value = isSecond ? months[months.length - 1] : months[Math.max(0, months.length - 2)];
    }
  });
}

/* ---------------------------------------------------------------- */
/* KPIs + Hero                                                       */
/* ---------------------------------------------------------------- */
function renderKPIs(k) {
  setText('kpiTotal', k.total);
  setText('kpiSolved', k.solved);
  setText('kpiFollowup', k.followup);
  setText('kpiOpen', k.open);
  setText('kpiResolutionRate', k.resolutionRatePct + '%');
  setText('kpiBranchCount', k.branchCount);
  setText('kpiEmployeeCount', k.employeeCount);
  setText('kpiAccountCount', k.accountCount);
}

function renderHero(k) {
  setText('heroTotal', k.total);
  setText('heroResolutionRate', k.resolutionRatePct + '%');
  setText('heroBranchCount', k.branchCount);
  setText('heroEmployeeCount', k.employeeCount);
}

/* ---------------------------------------------------------------- */
/* Dashboard charts                                                  */
/* ---------------------------------------------------------------- */
function renderDashboardCharts(data) {
  const branchNames = data.byBranch.map(b => b.name);
  const branchTotals = data.byBranch.map(b => b.total);
  bar('chBranch', branchNames, branchTotals);

  const empNames = data.byEmployee.map(e => e.name);
  const empTotals = data.byEmployee.map(e => e.total);
  bar('chEmployee', empNames, empTotals, true);

  const accNames = data.byAccount.map(a => a.name);
  const accTotals = data.byAccount.map(a => a.total);
  bar('chAccount', accNames, accTotals, true);

  const typeNames = data.byProblemType.map(t => t.name);
  const typeTotals = data.byProblemType.map(t => t.total);
  doughnut('chType', typeNames, typeTotals);

  doughnut('chSolvedOpen',
    ['تم الحل','قيد المتابعة','لم يتم الحل'],
    [data.kpis.solved, data.kpis.followup, data.kpis.open]
  );

  const dayLabels = data.dailyTrend.map(d => d.date);
  const dayTotals = data.dailyTrend.map(d => d.total);
  line('chDaily', dayLabels, dayTotals, '#1FA971');
}

/* ---------------------------------------------------------------- */
/* Branch performance page                                           */
/* ---------------------------------------------------------------- */
function renderBranchTable(byBranch) {
  document.getElementById('branchCountLabel').textContent = byBranch.length + ' فرع';
  const body = document.getElementById('branchTableBody');
  if (!byBranch.length) {
    body.innerHTML = '<tr><td colspan="7" class="empty-note">لا توجد بيانات مطابقة للفلاتر الحالية</td></tr>';
  } else {
    body.innerHTML = byBranch.map((b, i) => `
      <tr><td class="rank-cell">${i+1}</td><td><strong>${escapeHtml(b.name)}</strong></td><td>${b.total}</td>
      <td>${b.solved}</td><td>${b.followup}</td><td>${b.open}</td>
      <td><span class="res-bar"><span style="width:${b.resolutionRatePct}%"></span></span>${b.resolutionRatePct}%</td></tr>`
    ).join('');
  }
  bar('chBranchRes', byBranch.map(b => b.name), byBranch.map(b => b.resolutionRatePct));
}

function branchCompare() {
  const m1 = val('branchM1'), m2 = val('branchM2');
  if (!m1 || !m2) { alert('لا يوجد بيانات مؤرخة كافية لعمل مقارنة بين شهرين بعد.'); return; }
  google.script.run
    .withSuccessHandler(onBranchCompare)
    .withFailureHandler(onLoadError)
    .getMonthComparison('branch', m1, m2, getCurrentFilters());
}

function onBranchCompare(res) {
  setText('branchCompM1Total', res.summary.totalA);
  setText('branchCompM2Total', res.summary.totalB);
  setText('branchCompDiff', (res.summary.diff >= 0 ? '+' : '') + res.summary.diff);
  setText('branchCompChangePct', res.summary.changePct === null ? '—' : (res.summary.changePct >= 0 ? '+' : '') + res.summary.changePct + '%');

  const top6 = res.rows.slice(0, 6);
  groupedBar('chBranchCompare', top6.map(r => r.name), top6.map(r => r.totalA), top6.map(r => r.totalB), res.monthA, res.monthB);
}

/* ---------------------------------------------------------------- */
/* Employee performance page                                         */
/* ---------------------------------------------------------------- */
function renderEmployeeTable(byEmployee) {
  document.getElementById('employeeCountLabel').textContent = byEmployee.length + ' موظفة';
  const body = document.getElementById('employeeTableBody');
  if (!byEmployee.length) {
    body.innerHTML = '<tr><td colspan="7" class="empty-note">لا توجد بيانات مطابقة للفلاتر الحالية</td></tr>';
  } else {
    body.innerHTML = byEmployee.map((e, i) => `
      <tr><td class="rank-cell">${i+1}</td><td><strong>${escapeHtml(e.name)}</strong></td><td>${e.total}</td>
      <td>${e.solved}</td><td>${e.followup}</td><td>${e.open}</td>
      <td><span class="res-bar"><span style="width:${e.resolutionRatePct}%"></span></span>${e.resolutionRatePct}%</td></tr>`
    ).join('');
  }
  bar('chEmployeeWorkload', byEmployee.map(e => e.name), byEmployee.map(e => e.total));
}

function renderEmployeeStats(byEmployee, kpis) {
  if (byEmployee.length) {
    setText('topEmployeeLabel', byEmployee[0].name + ' — ' + byEmployee[0].total + ' حالة');
  } else {
    setText('topEmployeeLabel', '—');
  }
  const avg = byEmployee.length ? Math.round((kpis.total / byEmployee.length) * 10) / 10 : 0;
  setText('avgPerEmployeeLabel', avg + ' حالة');
}

function employeeCompare() {
  const m1 = val('employeeM1'), m2 = val('employeeM2');
  if (!m1 || !m2) { alert('لا يوجد بيانات مؤرخة كافية لعمل مقارنة بين شهرين بعد.'); return; }
  google.script.run
    .withSuccessHandler(onEmployeeCompare)
    .withFailureHandler(onLoadError)
    .getMonthComparison('employee', m1, m2, getCurrentFilters());
}

function onEmployeeCompare(res) {
  const body = document.getElementById('employeeCompareBody');
  if (!res.rows.length) {
    body.innerHTML = '<tr><td colspan="8" class="empty-note">لا توجد بيانات لهذين الشهرين</td></tr>';
  } else {
    body.innerHTML = res.rows.map(r => {
      let badge;
      if (r.changePct === null) badge = '<span class="badge-status badge-flat">⚪ لا يوجد أساس للمقارنة</span>';
      else if (r.changePct > 3) badge = '<span class="badge-status badge-up">🟢 تحسن</span>';
      else if (r.changePct < -3) badge = '<span class="badge-status badge-down">🔴 انخفاض</span>';
      else badge = '<span class="badge-status badge-flat">⚪ ثابت</span>';
      const pctText = r.changePct === null ? '—' : (r.changePct >= 0 ? '+' : '') + r.changePct + '%';
      return `<tr><td><strong>${escapeHtml(r.name)}</strong></td><td>${r.totalA}</td><td>${r.solvedA}</td>
        <td>${r.totalB}</td><td>${r.solvedB}</td><td>${r.diff >= 0 ? '+' : ''}${r.diff}</td>
        <td>${pctText}</td><td>${badge}</td></tr>`;
    }).join('');
  }
  const top6 = res.rows.slice(0, 6);
  groupedBar('chEmployeeCompare', top6.map(r => r.name), top6.map(r => r.totalA), top6.map(r => r.totalB), res.monthA, res.monthB);
}

/* ---------------------------------------------------------------- */
/* Open Cases page                                                   */
/* ---------------------------------------------------------------- */
function renderOpenCases(cases) {
  lastOpenCases = cases || [];
  applyLiveSearch(document.getElementById('liveSearch').value);
}

function applyLiveSearch(query) {
  const q = (query || '').trim().toLowerCase();
  const rows = !q ? lastOpenCases : lastOpenCases.filter(c =>
    [c.waybillCode, c.account, c.driver, c.employee, c.branch].some(v => v && v.toLowerCase().includes(q))
  );
  document.getElementById('liveCount').textContent = rows.length;
  const body = document.getElementById('liveTableBody');
  if (!rows.length) {
    body.innerHTML = '<tr><td colspan="10" class="empty-note">لا توجد حالات مفتوحة مطابقة</td></tr>';
    return;
  }
  const pillClass = { OPEN: 'pill-open', FOLLOWUP: 'pill-followup', SOLVED: 'pill-solved' };
  body.innerHTML = rows.map(c => `
    <tr><td>${c.date || '—'}</td><td><strong>${escapeHtml(c.waybillCode)}</strong></td><td>${escapeHtml(c.account)}</td>
    <td>${escapeHtml(c.driver)}</td><td>${escapeHtml(c.branch)}</td><td>${escapeHtml(c.problemType)}</td>
    <td><span class="pill ${pillClass[c.statusBucket] || ''}">${escapeHtml(c.statusLabel)}</span></td>
    <td>${escapeHtml(c.employee)}</td><td>${escapeHtml(c.lastUpdated || '—')}</td>
    <td style="max-width:160px;color:var(--text-muted);">${escapeHtml(c.notes)}</td></tr>`
  ).join('');
}

/* ---------------------------------------------------------------- */
/* Reports page                                                      */
/* ---------------------------------------------------------------- */
function showReportStats() {
  const btn = document.getElementById('showStatsBtn');
  btn.textContent = '⏳ جاري الحساب...';
  google.script.run
    .withSuccessHandler(onReportsBundle)
    .withFailureHandler(err => { onLoadError(err); btn.innerHTML = '📊 عرض الإحصائية'; })
    .getReportsBundle(getCurrentFilters());
}

function onReportsBundle(bundle) {
  lastReportsBundle = bundle;
  document.getElementById('showStatsBtn').innerHTML = '✅ تم تحديث الإحصائية';
  setTimeout(() => { document.getElementById('showStatsBtn').innerHTML = '📊 عرض الإحصائية'; }, 1200);

  setText('reportTotal', bundle.kpis.total);
  setText('reportSolved', bundle.kpis.solved);
  setText('reportOpen', bundle.kpis.open);
  setText('reportFollowup', bundle.kpis.followup);
  setText('reportTopBranch', bundle.topBranch ? `${bundle.topBranch.name} (${bundle.topBranch.total})` : '—');
  setText('reportTopAccount', bundle.topAccount ? `${bundle.topAccount.name} (${bundle.topAccount.total})` : '—');
  setText('reportTopProblemType', bundle.topProblemType ? `${bundle.topProblemType.name} (${bundle.topProblemType.total})` : '—');
  setText('reportAvgPerEmployee', bundle.avgCasesPerEmployee);

  bar('chReportBranch', bundle.byBranch.map(b => b.name), bundle.byBranch.map(b => b.total));
  bar('chReportEmployee', bundle.byEmployee.map(e => e.name), bundle.byEmployee.map(e => e.total), true);
}

function exportReportCSV() {
  if (!lastReportsBundle) { alert('اضغطي "عرض الإحصائية" أولاً.'); return; }
  const b = lastReportsBundle;
  let csv = 'ملخص التقرير\n';
  csv += 'إجمالى المشاكل,' + b.kpis.total + '\n';
  csv += 'تم الحل,' + b.kpis.solved + '\n';
  csv += 'قيد المتابعة,' + b.kpis.followup + '\n';
  csv += 'لم يتم الحل,' + b.kpis.open + '\n';
  csv += 'نسبة الحل,' + b.kpis.resolutionRatePct + '%\n\n';

  csv += 'الفرع,عدد المشاكل,تم الحل,قيد المتابعة,لم يتم الحل,نسبة الحل\n';
  b.byBranch.forEach(r => { csv += `${r.name},${r.total},${r.solved},${r.followup},${r.open},${r.resolutionRatePct}%\n`; });
  csv += '\nالموظفة,عدد الحالات,تم الحل,قيد المتابعة,لم يتم الحل,نسبة الحل\n';
  b.byEmployee.forEach(r => { csv += `${r.name},${r.total},${r.solved},${r.followup},${r.open},${r.resolutionRatePct}%\n`; });

  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'fleet-support-report-' + new Date().toISOString().slice(0,10) + '.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ---------------------------------------------------------------- */
/* Chart helpers (destroy-before-create to avoid duplicate canvases) */
/* ---------------------------------------------------------------- */
function destroyChart(id) {
  if (chartInstances[id]) { chartInstances[id].destroy(); delete chartInstances[id]; }
}
function bar(id, labels, data, horizontal) {
  destroyChart(id);
  const ctx = document.getElementById(id);
  if (!ctx) return;
  chartInstances[id] = new Chart(ctx, { type: 'bar',
    data: { labels, datasets: [{ data, backgroundColor: '#2E86DE', borderRadius: 6, maxBarThickness: 26 }] },
    options: { indexAxis: horizontal ? 'y' : 'x', plugins: { legend: { display: false } }, responsive: true, maintainAspectRatio: false }
  });
}
function doughnut(id, labels, data) {
  destroyChart(id);
  const ctx = document.getElementById(id);
  if (!ctx) return;
  chartInstances[id] = new Chart(ctx, { type: 'doughnut',
    data: { labels, datasets: [{ data, backgroundColor: palette, borderWidth: 2, borderColor: '#fff' }] },
    options: { plugins: { legend: { position: 'bottom', labels: { boxWidth: 9, padding: 10 } } }, responsive: true, maintainAspectRatio: false, cutout: '62%' }
  });
}
function line(id, labels, data, color) {
  destroyChart(id);
  const ctx = document.getElementById(id);
  if (!ctx) return;
  chartInstances[id] = new Chart(ctx, { type: 'line',
    data: { labels, datasets: [{ data, borderColor: color, backgroundColor: color + '22', fill: true, tension: .35, pointRadius: 3 }] },
    options: { plugins: { legend: { display: false } }, responsive: true, maintainAspectRatio: false }
  });
}
function groupedBar(id, labels, d1, d2, l1, l2) {
  destroyChart(id);
  const ctx = document.getElementById(id);
  if (!ctx) return;
  chartInstances[id] = new Chart(ctx, { type: 'bar',
    data: { labels, datasets: [
      { label: l1, data: d1, backgroundColor: '#C9D6E6', borderRadius: 6 },
      { label: l2, data: d2, backgroundColor: '#2E86DE', borderRadius: 6 }
    ] }, options: { plugins: { legend: { position: 'bottom' } }, responsive: true, maintainAspectRatio: false }
  });
}

/* ---------------------------------------------------------------- */
/* Small utils                                                       */
/* ---------------------------------------------------------------- */
function setText(id, text) { const el = document.getElementById(id); if (el) el.textContent = text; }
function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s) { return escapeHtml(s); }

/* ---------------------------------------------------------------- */
/* Navigation                                                        */
/* ---------------------------------------------------------------- */
function goToPage(pageId) {
  document.querySelectorAll('.sheet-tab').forEach(t => t.classList.toggle('active', t.dataset.page === pageId));
  document.querySelectorAll('.page').forEach(p => p.classList.toggle('active', p.id === pageId));
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ---------------------------------------------------------------- */
/* Event wiring                                                      */
/* ---------------------------------------------------------------- */
document.querySelectorAll('.sheet-tab').forEach(tab => tab.addEventListener('click', () => goToPage(tab.dataset.page)));
document.querySelectorAll('.menu-card[data-goto]').forEach(c => c.addEventListener('click', () => goToPage(c.dataset.goto)));

document.getElementById('applyFiltersBtn').addEventListener('click', loadAll);
document.getElementById('clearFiltersBtn').addEventListener('click', () => {
  ['filterDateFrom','filterDateTo','filterBranch','filterEmployee','filterAccount','filterDriver','filterProblemType','filterStatus']
    .forEach(id => { const el = document.getElementById(id); if (el) el.value = ''; });
  loadAll();
});

document.getElementById('refreshBtn').addEventListener('click', function () {
  const btn = this;
  btn.classList.add('spinning');
  btn.disabled = true;
  google.script.run
    .withSuccessHandler(data => { onFullAppData(data); btn.classList.remove('spinning'); btn.disabled = false; })
    .withFailureHandler(err => { onLoadError(err); btn.classList.remove('spinning'); btn.disabled = false; })
    .refreshAndGetFullAppData(getCurrentFilters());
});

document.getElementById('liveSearch').addEventListener('input', e => applyLiveSearch(e.target.value));
document.getElementById('branchCompareBtn').addEventListener('click', branchCompare);
document.getElementById('employeeCompareBtn').addEventListener('click', employeeCompare);
document.getElementById('showStatsBtn').addEventListener('click', showReportStats);
document.getElementById('exportExcelBtn').addEventListener('click', exportReportCSV);
document.getElementById('printBtn').addEventListener('click', () => window.print());

/* ---------------------------------------------------------------- */
/* Boot                                                               */
/* ---------------------------------------------------------------- */
loadAll();
</script>
