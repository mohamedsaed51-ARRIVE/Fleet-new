<style>
  :root{
    --bg:#F3F6FA; --surface:#FFFFFF; --surface-soft:#EEF2F7; --border:#E2E8F1;
    --text:#152238; --text-muted:#697A91;
    --primary:#1D4E89; --primary-dark:#123A68; --primary-light:#E7F0FB; --accent:#2E86DE;
    --success:#1FA971; --success-bg:#E4F7EE;
    --warning:#E1962E; --warning-bg:#FCF1DE;
    --danger:#E5484D; --danger-bg:#FCE8E9;
    --shadow: 0 1px 2px rgba(21,34,56,0.04), 0 6px 20px rgba(21,34,56,0.06);
    --radius: 14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'Tajawal',sans-serif;padding-bottom:80px;}
  h1,h2,h3{font-family:'Tajawal',sans-serif;font-weight:800;}
  .note-banner{background:var(--success-bg);border-bottom:1px solid #BFE7D4;color:var(--success);font-size:12.5px;text-align:center;padding:8px 12px;font-weight:700;}
  .note-banner.warn{background:#FFF7E6;border-bottom:1px solid #F0DDA6;color:#7A5A12;}

  .topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 28px;
    background:linear-gradient(180deg,#FFFFFF 0%, #FBFCFE 100%);border-bottom:1px solid var(--border);}
  .logo-wrap{display:flex;align-items:center;gap:10px;}
  .logo-mark{width:36px;height:36px;border-radius:9px;background:linear-gradient(135deg,var(--primary),var(--accent));
    display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:14px;box-shadow:var(--shadow);}
  .logo-text{font-weight:800;font-size:16px;color:var(--primary-dark);}
  .logo-sub{font-size:10.5px;color:var(--text-muted);font-weight:700;}
  .center-title{text-align:center;}
  .center-title h1{font-size:19px;margin:0;}
  .center-title .sub{font-size:12px;color:var(--text-muted);font-weight:600;}
  .status-pill{display:flex;align-items:center;gap:7px;background:var(--success-bg);color:var(--success);
    padding:7px 14px;border-radius:20px;font-size:12.5px;font-weight:800;}
  .status-dot{width:8px;height:8px;border-radius:50%;background:var(--success);box-shadow:0 0 0 3px rgba(31,169,113,.18);}

  .control-row{display:flex;align-items:center;justify-content:space-between;padding:12px 28px;
    background:var(--surface);border-bottom:1px solid var(--border);flex-wrap:wrap;gap:10px;}
  .refresh-btn{display:flex;align-items:center;gap:8px;background:var(--primary);color:#fff;border:none;
    padding:9px 18px;border-radius:10px;font-weight:800;font-size:13px;cursor:pointer;box-shadow:var(--shadow);font-family:'Tajawal',sans-serif;}
  .refresh-btn:hover{background:var(--primary-dark);}
  .refresh-btn:disabled{opacity:.6;cursor:default;}
  .refresh-btn.spinning .spin{display:inline-block;animation:spin .6s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .timestamps{display:flex;gap:22px;flex-wrap:wrap;}
  .ts-item{font-size:12px;color:var(--text-muted);font-weight:600;}
  .ts-item b{color:var(--text);font-weight:800;}

  /* ===== GLOBAL FILTER SECTION (top of every page) ===== */
  .filter-section{background:var(--surface-soft);border-bottom:1px solid var(--border);padding:14px 28px;}
  .filter-section .filter-title{font-size:11.5px;color:var(--text-muted);font-weight:800;margin-bottom:8px;display:flex;align-items:center;gap:6px;}
  .filter-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;}
  .filter-group{display:flex;flex-direction:column;}
  .filter-group.hidden{display:none;}
  .filter-group label{font-size:10.5px;color:var(--text-muted);font-weight:700;margin-bottom:3px;display:flex;align-items:center;gap:4px;}
  .filter-group select, .filter-group input{
    background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:7px 10px;
    font-size:12px;font-family:'Tajawal',sans-serif;font-weight:700;color:var(--text);cursor:pointer;
  }

  main{padding:24px 28px 40px;max-width:1400px;margin:0 auto;}
  .page{display:none;animation:fadeIn .25s ease;}
  .page.active{display:block;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
  .page-title{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:8px;}
  .page-title h2{font-size:20px;margin:0;}
  .page-title .desc{font-size:12.5px;color:var(--text-muted);font-weight:600;}
  .section-heading{font-size:14.5px;font-weight:800;margin:26px 0 12px;display:flex;align-items:center;gap:8px;color:var(--primary-dark);}
  .section-heading:first-child{margin-top:0;}

  .kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px;}
  .kpi-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;
    box-shadow:var(--shadow);border-right:4px solid var(--accent-bar,var(--primary));}
  .kpi-icon{font-size:19px;margin-bottom:8px;display:inline-block;}
  .kpi-value{font-size:25px;font-weight:900;line-height:1;}
  .kpi-label{font-size:12.5px;color:var(--text-muted);font-weight:700;margin-top:6px;}
  .kpi-trend{font-size:11px;font-weight:800;margin-top:8px;display:inline-block;padding:2px 7px;border-radius:6px;}
  .trend-up{color:var(--success);background:var(--success-bg);}
  .trend-down{color:var(--danger);background:var(--danger-bg);}
  .trend-flat{color:var(--text-muted);background:var(--surface-soft);}
  .trend-none{display:none;}

  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);}
  .card h3{font-size:13.5px;margin:0 0 12px;display:flex;align-items:center;gap:7px;}
  .card .chart-wrap{position:relative;height:220px;}
  .card .chart-wrap.small{height:180px;}
  .empty-note{font-size:12px;color:var(--text-muted);text-align:center;padding:30px 10px;}

  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  thead th{text-align:right;font-size:11px;color:var(--text-muted);font-weight:800;padding:10px 12px;border-bottom:2px solid var(--border);background:var(--surface-soft);}
  tbody td{padding:10px 12px;border-bottom:1px solid var(--border);}
  tbody tr:hover{background:var(--primary-light);}
  .pill{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:800;display:inline-block;}
  .pill-open{background:var(--danger-bg);color:var(--danger);}
  .pill-followup{background:var(--warning-bg);color:var(--warning);}
  .pill-solved{background:var(--success-bg);color:var(--success);}
  .rank-cell{font-weight:900;color:var(--primary);}
  .res-bar{width:80px;height:6px;background:var(--surface-soft);border-radius:3px;overflow:hidden;display:inline-block;vertical-align:middle;margin-left:6px;}
  .res-bar span{display:block;height:100%;background:var(--success);}

  .table-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px;}
  .table-card .table-head{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:10px;}
  .table-scroll{overflow-x:auto;}
  .search-box{display:flex;align-items:center;gap:8px;background:var(--surface-soft);border:1px solid var(--border);border-radius:9px;padding:7px 12px;min-width:260px;}
  .search-box input{border:none;background:transparent;outline:none;font-size:12.5px;width:100%;font-family:'Tajawal',sans-serif;}

  .stat-strip{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px;}
  .stat-card{background:linear-gradient(135deg,var(--primary-dark),var(--primary));color:#fff;border-radius:var(--radius);
    padding:16px 18px;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:space-between;}
  .stat-card .label{font-size:11.5px;opacity:.9;font-weight:700;}
  .stat-card .value{font-size:20px;font-weight:900;margin-top:3px;}
  .stat-card .icon{font-size:26px;}

  /* ===== MONTH COMPARISON ===== */
  .compare-bar{display:flex;align-items:flex-end;gap:14px;background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);margin-bottom:16px;flex-wrap:wrap;}
  .compare-bar .filter-group{min-width:150px;}
  .compare-bar .vs{font-weight:900;color:var(--text-muted);padding-bottom:8px;}
  .compare-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;}
  .compare-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);}
  .compare-card .q{font-size:11px;color:var(--text-muted);font-weight:700;margin-bottom:6px;}
  .compare-card .a{font-size:17px;font-weight:900;color:var(--primary-dark);}
  .badge-status{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:800;display:inline-flex;align-items:center;gap:4px;}
  .badge-up{background:var(--success-bg);color:var(--success);}
  .badge-down{background:var(--danger-bg);color:var(--danger);}
  .badge-flat{background:var(--surface-soft);color:var(--text-muted);}

  .filters-actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
  .action-btn{display:flex;align-items:center;gap:7px;border:1px solid var(--border);background:var(--surface-soft);
    padding:9px 16px;border-radius:9px;font-weight:800;font-size:12.5px;cursor:pointer;color:var(--text);font-family:'Tajawal',sans-serif;}
  .action-btn.primary{background:var(--primary);color:#fff;border-color:var(--primary);}

  .answers-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;}
  .answer-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);}
  .answer-card .q{font-size:11px;color:var(--text-muted);font-weight:700;margin-bottom:6px;}
  .answer-card .a{font-size:17px;font-weight:900;color:var(--primary-dark);}

  .hero{background:linear-gradient(135deg,var(--primary-dark),var(--primary) 60%, var(--accent));
    border-radius:18px;padding:38px 34px;color:#fff;box-shadow:var(--shadow);margin-bottom:22px;
    display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:20px;}
  .hero-right{max-width:560px;}
  .hero h1{font-size:26px;margin:0 0 8px;}
  .hero p{font-size:13.5px;opacity:.9;margin:0 0 16px;line-height:1.8;font-weight:500;}
  .hero-stats{display:flex;gap:24px;flex-wrap:wrap;}
  .hero-stat b{display:block;font-size:20px;font-weight:900;}
  .hero-stat span{font-size:11px;opacity:.85;font-weight:600;}
  .hero-badge{background:rgba(255,255,255,.15);padding:8px 16px;border-radius:20px;font-size:12.5px;font-weight:800;display:inline-flex;align-items:center;gap:7px;margin-bottom:14px;}

  .menu-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
  .menu-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);
    cursor:pointer;transition:transform .15s ease, box-shadow .15s ease;}
  .menu-card:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(21,34,56,.1);}
  .menu-card .m-icon{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:19px;margin-bottom:12px;}
  .menu-card h4{margin:0 0 5px;font-size:14.5px;}
  .menu-card p{margin:0 0 14px;font-size:12px;color:var(--text-muted);line-height:1.7;}
  .menu-card .go{font-size:12px;font-weight:800;color:var(--primary);}

  .sheet-tabs{position:fixed;bottom:0;right:0;left:0;display:flex;align-items:flex-end;gap:2px;
    background:#EAEFF5;border-top:1px solid var(--border);padding:10px 20px 0;
    box-shadow:0 -6px 18px rgba(21,34,56,.06);z-index:20;overflow-x:auto;}
  .sheet-tab{display:flex;align-items:center;gap:8px;background:#DCE3EC;color:var(--text-muted);
    padding:10px 18px;border-radius:10px 10px 0 0;font-size:12.5px;font-weight:800;cursor:pointer;white-space:nowrap;
    border:1px solid transparent;border-bottom:none;}
  .sheet-tab .dot{width:7px;height:7px;border-radius:50%;background:var(--text-muted);}
  .sheet-tab:hover{background:#CFD9E6;}
  .sheet-tab.active{background:var(--surface);color:var(--primary-dark);border-color:var(--border);box-shadow:0 -2px 8px rgba(21,34,56,.05);}
  .sheet-tab.active .dot{background:var(--primary);}
  .sheet-tab:nth-child(1) .dot{background:#8B5CF6;}
  .sheet-tab:nth-child(2) .dot{background:#2E86DE;}
  .sheet-tab:nth-child(3) .dot{background:#1FA971;}
  .sheet-tab:nth-child(4) .dot{background:#E1962E;}
  .sheet-tab:nth-child(5) .dot{background:#E5484D;}
  .sheet-tab:nth-child(6) .dot{background:#1D4E89;}

  .footer-signature{text-align:center;font-size:10.5px;color:var(--text-muted);padding:14px 0 6px;font-weight:700;}

  @media (max-width:1100px){
    .filter-grid{grid-template-columns:repeat(3,1fr);}
    .kpi-grid{grid-template-columns:repeat(2,1fr);}
    .grid-2,.grid-3,.menu-grid,.stat-strip,.answers-grid,.compare-cards{grid-template-columns:1fr 1fr;}
  }
</style>
